name: Validate NotVisuals

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Confirm source archive is not a playable resource pack
        run: |
          test ! -e pack.mcmeta
          test ! -e assets
          test -f src/pack/pack.mcmeta
      - name: Syntax-check R19 import and archive parity tooling
        run: python3 -m py_compile scripts/import_r19_zip.py scripts/validate_r19.py scripts/test_r19.py
      - name: Validate v8 candidate graphics (legacy source only)
        if: ${{ hashFiles('docs/R19_SOURCE_MANIFEST.json') == '' }}
        run: python3 scripts/validate_pack.py
      - name: Validate full R19 source provenance, images and pipeline
        if: ${{ hashFiles('docs/R19_SOURCE_MANIFEST.json') != '' }}
        run: python3 scripts/validate_r19.py
      - name: Run candidate-only regression tests
        if: ${{ hashFiles('docs/R19_SOURCE_MANIFEST.json') == '' }}
        run: python3 -m unittest discover -s scripts -p 'test_pack.py' -v
      - name: Install GLSL static compiler
        if: ${{ hashFiles('docs/R19_SOURCE_MANIFEST.json') == '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
      - name: Fetch pinned renderer contracts and compile GLSL variants
        if: ${{ hashFiles('docs/R19_SOURCE_MANIFEST.json') == '' }}
        run: |
          python3 scripts/shader_sources.py --fetch /tmp/notvisuals-26.3
          python3 scripts/check_glsl.py
      - name: Install headless GLSL test dependencies
        if: ${{ hashFiles('docs/R19_SOURCE_MANIFEST.json') == '' }}
        run: |
          sudo apt-get install -y -qq libegl1-mesa-dev libgl1-mesa-dri
          python3 -m venv /tmp/notvisuals-tools
          /tmp/notvisuals-tools/bin/pip install -r scripts/requirements-gpu.txt
      - name: Fetch pinned renderer contracts and execute synthetic shader tests
        if: ${{ hashFiles('docs/R19_SOURCE_MANIFEST.json') == '' }}
        env:
          NV_REQUIRE_GPU: '1'
          NV_VANILLA_ROOT: /tmp/notvisuals-26.3
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_SHADER_CACHE_DIR: /tmp/notvisuals-mesa
        run: |
          /tmp/notvisuals-tools/bin/python -m unittest discover -s scripts -p 'test_gpu.py' -v
      - name: Check licensing manifest (developer candidate only)
        run: python3 scripts/license_audit.py
      - name: R19 source equivalence and ZIP/license regression tests
        if: ${{ hashFiles('docs/R19_SOURCE_MANIFEST.json') != '' }}
        run: python3 -m unittest discover -s scripts -p 'test_r19.py' -v
      - name: R20 image- and shader-invariant regression tests
        if: ${{ hashFiles('docs/R20_CHANGESET.json') != '' }}
        run: python3 -m unittest discover -s scripts -p 'test_r20.py' -v
      - name: R20 GLSL compilation of edited stages
        if: ${{ hashFiles('docs/R20_CHANGESET.json') != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          python3 scripts/shader_sources.py --fetch /tmp/notvisuals-26.3
          python3 scripts/compile_r20_shaders.py --vanilla-root /tmp/notvisuals-26.3
      - name: Build local experimental ZIP for CI tests
        run: python3 scripts/build_pack.py
      - name: Verify archive contents
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          outputs = list(Path("dist").glob("*.zip"))
          assert len(outputs) == 1, outputs
          with ZipFile(outputs[0]) as z:
              assert z.testzip() is None
              assert "pack.mcmeta" in z.namelist()
              assert "CREDITS.md" in z.namelist()
          print("ZIP integrity and license notices verified:", outputs[0])
          PY
      # Exception for the owner's temporary QA download; NOT a published release.
      # Subsequent commits do not upload unless deliberately tagged [qa-download].
      - name: Upload one-time R20 test ZIP for owner
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/v8-ink-and-light' && contains(github.event.head_commit.message, '[qa-download]') }}
        uses: actions/upload-artifact@v4
        with:
          name: NotVisuals-v8-R20-QA-only
          path: dist/NotVisuals_26.3_v8_R20_Visual_Polish.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Distribution note
        run: echo "::notice::Only commits explicitly marked [qa-download] publish a three-day test artifact; official installs remain Modrinth-first."
